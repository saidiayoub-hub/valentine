<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine 💘</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating hearts -->
    <div class="hearts-container" id="heartsContainer"></div>

    <div class="container fade-in">
        <h1>Valentine? Yeah… I guess I like you 😌❤️</h1>
        <p class="subtitle">Not a love story, just vibes.</p>

        <!-- Love Message Generator -->
        <div class="card">
            <h2>💌 Love Message Generator</h2>
            <input type="text" id="yourName" placeholder="Your name">
            <input type="text" id="crushName" placeholder="Crush name">
            <button onclick="generateMessage()">Generate 💘</button>
            <p id="result"></p>
        </div>

        <!-- Valentine Countdown -->
        <div class="card">
            <h2>⏳ Valentine Countdown</h2>
            <p id="countdown"></p>
        </div>

        <!-- Love Calculator -->
        <div class="card">
            <h2>💖 Love Calculator</h2>
            <input type="text" id="name1" placeholder="Your name">
            <input type="text" id="name2" placeholder="Partner's name">
            <button onclick="calculateLove()">Calculate Love 💕</button>
            <p id="loveResult"></p>
            <div id="loveBar"></div>
        </div>

        <!-- Do you love me -->
        <div class="card">
            <h2>❤️ Do you love me?</h2>
            <button id="yesBtn" onclick="sayYes()">Yes ❤️</button>
            <button id="noBtn" onmouseover="moveButton()">No 💔</button>
            <p id="questionResult"></p>
        </div>

        <!-- Love Quiz -->
        <div class="card">
            <h2>💝 Quick Love Quiz</h2>
            <p id="quizQuestion">What's your ideal date?</p>
            <button onclick="answerQuiz('romantic')">Romantic dinner 🍷</button>
            <button onclick="answerQuiz('adventure')">Adventure 🏔️</button>
            <button onclick="answerQuiz('chill')">Netflix & Chill 🎬</button>
            <p id="quizResult"></p>
        </div>

        <!-- Random Compliment -->
        <div class="card">
            <h2>✨ Random Compliment Generator</h2>
            <button onclick="getCompliment()">Get a Compliment 💫</button>
            <p id="compliment"></p>
        </div>

    </div>

<script src="script.js"></script>
</body>
</html>
